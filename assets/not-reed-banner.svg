<svg width="800" height="160" viewBox="0 0 800 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="160" fill="#0d0d0d"/>

  <!-- Subtle scanline texture -->
  <defs>
    <pattern id="scan" x="0" y="0" width="800" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="800" height="1" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
  </defs>
  <rect width="800" height="160" fill="url(#scan)"/>

  <!-- Accent bar -->
  <rect x="40" y="36" width="2" height="88" fill="#22d3ee" opacity="0.85"/>

  <!-- Name -->
  <text x="58" y="95" font-family="'Courier New', Courier, monospace" font-size="54" font-weight="700" fill="#efefef">not-reed</text>

  <!-- Blinking cursor -->
  <text x="320" y="95" font-family="'Courier New', Courier, monospace" font-size="54" font-weight="700" fill="#22d3ee" id="cursor">▌</text>

  <!-- Tagline -->
  <text x="60" y="122" font-family="'Courier New', Courier, monospace" font-size="13" fill="#555555" letter-spacing="0.8">building tools that think. sometimes onchain.</text>

  <style>
    #cursor {
      animation: blink 1.1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</svg>
